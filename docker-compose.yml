services:
  postgres:
    image: postgres:18-alpine                                # alpine = smaller image, postgres 18 = latest stable
    container_name: fitness-userservice
    environment:
      POSTGRES_DB: ${USERSERVICE_POSTGRES_DB}                # default database — our public schema lives here
      POSTGRES_USER: ${USERSERVICE_POSTGRES_USER}            # superuser for local dev (use least-privilege in prod)
      POSTGRES_PASSWORD: ${USERSERVICE_POSTGRES_PASSWORD}    # local only — prod uses Railway secrets
    ports:
      - "5432:5432"                                          # expose to host so IntelliJ DB tools can connect
    volumes:
      - postgres_data:/var/lib/postgresql                    # persist data across container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness_user -d fitness_user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: