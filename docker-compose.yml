  # Mongo
  mongo:
    image: mongo:8
    restart: unless-stopped
    container_name: fitness-activityservice
    environment:
      MONGO_INITDB_DATABASE: ${ACTIVITYSERVICE_MONGO_DB}
      MONGO_INITDB_ROOT_USERNAME: ${ACTIVITYSERVICE_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${ACTIVITYSERVICE_MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitness_backend

